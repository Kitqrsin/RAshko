services:
  ros2_arm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rashko_ros2_windows
    working_dir: /workspace
    volumes:
      - .:/workspace
      - ./Communicator:/communicator:ro
      - ros2_build:/workspace/build
      - ros2_install:/workspace/install
      - ros2_log:/workspace/log
    environment:
      PYTHONPATH: /communicator
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
      RASHKO_PI_HOST: ${RASHKO_PI_HOST:-192.168.1.50}
      RASHKO_PI_PORT: ${RASHKO_PI_PORT:-5005}
      RASHKO_SHARED_SECRET: ${RASHKO_SHARED_SECRET:?Run .\windows.ps1 Setup first}
      RASHKO_CAMERA_PORT: ${RASHKO_CAMERA_PORT:-8080}
      RASHKO_CAMERA_URL: ${RASHKO_CAMERA_URL:-}
      RASHKO_CAMERA_BACKEND: ${RASHKO_CAMERA_BACKEND:-auto}
      RASHKO_CAMERA_INFO_FILE: ${RASHKO_CAMERA_INFO_FILE:-}
      RASHKO_CAP_WORKCELL_CONFIG: ${RASHKO_CAP_WORKCELL_CONFIG:-/workspace/config/cap_workcell.example.yaml}
      RASHKO_CAP_CAMERA_WIDTH: ${RASHKO_CAP_CAMERA_WIDTH:-640}
      RASHKO_CAP_CAMERA_HEIGHT: ${RASHKO_CAP_CAMERA_HEIGHT:-480}
      # Zero locks the gripper open until its safe physical close endpoint is measured.
      RASHKO_GRIPPER_CLOSED_DEGREES: ${RASHKO_GRIPPER_CLOSED_DEGREES:-0}
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      DISPLAY: ${DISPLAY:-host.docker.internal:0.0}
    extra_hosts:
      - host.docker.internal:host-gateway
    stdin_open: true
    tty: true
    command:
      - /bin/bash
      - -lc
      - exec sleep infinity
    restart: unless-stopped

volumes:
  ros2_build:
  ros2_install:
  ros2_log:
