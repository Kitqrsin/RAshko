name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ROS Humble and Communicator tests
    runs-on: ubuntu-latest
    container: ros:humble
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      ROS_DOMAIN_ID: '177'
      ROS_LOCALHOST_ONLY: '1'
      RASHKO_TEST_TK: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ROS and test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-pip python3-tk xvfb xauth \
            ros-humble-ament-copyright ros-humble-ament-flake8 ros-humble-ament-pep257 \
            ros-humble-control-msgs ros-humble-moveit-msgs ros-humble-robot-state-publisher
          python3 -m pip install 'numpy<2' 'opencv-contrib-python-headless>=4.6,<4.12' Pillow 'pytest>=7,<8' PyYAML

      - name: Run controller, GUI, and Communicator tests
        run: |
          source /opt/ros/humble/setup.bash
          export PYTHONPATH="$PWD/src/arm_controller:$PWD/Communicator${PYTHONPATH:+:$PYTHONPATH}"
          python3 -m unittest discover -s Communicator/tests -v
          xvfb-run -a python3 -m pytest -q src/arm_controller/test

  windows-network:
    name: Windows Ethernet and UDP compatibility
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Windows networking tests
        shell: pwsh
        run: ./tests/test_raspberry_network.ps1 -PythonPath (Get-Command python).Source
